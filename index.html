<style>
  :root{
    --brand:#0C2BAA; --brand-2:#2a49d1; --ink:#14161c; --muted:#5d6370;
    --card:rgba(255,255,255,.94); --line:rgba(20,22,28,.09); --bg:#eef0f4;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:var(--bg);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink)}
  #scene{position:fixed;inset:0}
  #scene canvas{display:block;outline:none}
  .label{pointer-events:none;text-align:center;font-size:12px;line-height:1.25;color:#1c2030;
    background:rgba(255,255,255,.86);padding:3px 8px;border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,.08);white-space:nowrap}
  .label b{display:block;font-weight:600}
  .label span{color:var(--muted);font-size:11px}
  body.nolabels .label{display:none}

  .panel{position:fixed;left:16px;top:16px;width:340px;max-height:calc(100% - 32px);overflow:auto;
    background:var(--card);backdrop-filter:blur(10px);border-radius:18px;box-shadow:0 10px 40px rgba(16,24,64,.14);padding:18px}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .logo{display:flex;align-items:center;gap:7px;text-decoration:none;color:var(--ink)}
  .logo .blk{background:var(--brand);color:#fff;font-weight:700;font-size:15px;letter-spacing:-.3px;padding:5px 8px 6px;border-radius:6px;line-height:1}
  .logo .sp{font-weight:600;font-size:12px;letter-spacing:2.5px;color:var(--brand)}
  .proj{margin-left:auto;text-align:right;font-size:11px;color:var(--muted);line-height:1.3}
  .proj b{display:block;color:var(--ink);font-size:13px}
  h3{font-size:11px;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);font-weight:600;margin:16px 0 8px}
  .apts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .apt{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:10px 11px;cursor:pointer;text-align:left;font:inherit;color:inherit;transition:.15s}
  .apt b{display:block;font-size:17px;font-weight:600}
  .apt span{font-size:12px;color:var(--muted)}
  .apt.on{border-color:var(--brand);box-shadow:0 0 0 3px rgba(12,43,170,.12)}
  .styles{display:flex;flex-wrap:wrap;gap:7px}
  .st{display:flex;align-items:center;gap:7px;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 11px 6px 6px;cursor:pointer;font:inherit;font-size:13px;color:inherit;transition:.15s}
  .st i{width:20px;height:20px;border-radius:50%;display:block;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
  .st.on{border-color:var(--brand);background:var(--brand);color:#fff}
  .desc{font-size:13px;color:var(--muted);margin-top:10px;line-height:1.45;min-height:38px}
  .price{margin-top:14px;background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;border-radius:14px;padding:14px 15px}
  .price small{display:block;font-size:11px;opacity:.8;text-transform:uppercase;letter-spacing:1px}
  .price .v{font-size:23px;font-weight:700;margin:4px 0 2px;letter-spacing:-.4px}
  .price .n{font-size:11.5px;opacity:.85;line-height:1.4}
  .tools{position:fixed;right:16px;top:16px;display:flex;gap:6px;background:var(--card);border-radius:12px;padding:5px;box-shadow:0 6px 24px rgba(16,24,64,.12)}
  .tools button{border:0;background:transparent;font:inherit;font-size:13px;padding:8px 12px;border-radius:9px;cursor:pointer;color:var(--ink)}
  .tools button.on{background:var(--brand);color:#fff}
  .hint{position:fixed;right:16px;bottom:16px;font-size:12px;color:var(--muted);background:var(--card);padding:7px 11px;border-radius:10px}
  .toggle{display:none}
  @media (max-width:760px){
    .panel{left:8px;right:8px;top:auto;bottom:8px;width:auto;max-height:52%;padding:14px;border-radius:16px}
    .panel.collapsed .body{display:none}
    .toggle{display:block;position:absolute;right:12px;top:12px;border:0;background:#eef0f6;border-radius:8px;padding:6px 9px;font:inherit;font-size:12px}
    .proj{display:none}
    .tools{top:8px;right:8px}
    .hint{display:none}
    .price .v{font-size:20px}
  }

function canvasTex(w,h,draw){ const c=document.createElement('canvas'); c.width=w; c.height=h; draw(c.getContext('2d'),w,h);
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; t.wrapS=t.wrapT=THREE.RepeatWrapping; t.anisotropy=8; return t; }
function rnd(seed){ let x=Math.sin(seed*999)*10000; return x-Math.floor(x); }
function shade(hex,k){ const c=new THREE.Color(hex); c.multiplyScalar(k); return '#'+c.getHexString(); }
function herringbone(cols){
  return canvasTex(512,512,(g,w,h)=>{
    g.fillStyle=cols[0]; g.fillRect(0,0,w,h);
    const W=32, L=128; let i=0;
    const plank=(x,y,pw,ph,k)=>{ g.fillStyle=shade(cols[k%3],0.96+rnd(k)*0.08); g.fillRect(x,y,pw,ph);
      g.strokeStyle='rgba(60,40,20,.16)'; g.lineWidth=1.2; g.strokeRect(x+.5,y+.5,pw-1,ph-1); };
    for(let a=-40;a<=40;a++) for(let b=-20;b<=20;b++){
      const bx=a*W-b*(L+W), by=-a*W-b*(L-W);
      for(const [ox,oy] of [[0,0],[512,0],[-512,0],[0,512],[0,-512]]){
        const x=bx+ox, y=by+oy, k=(((a*7+b*13)%97)+97)%97;
        if(x>-L-W&&x<w+W&&y>-L&&y<h+L){ plank(x,y,L,W,k); plank(x-W,y-3*W,W,L,k+1); }
      }
    }
    g.globalAlpha=.05; for(let n=0;n<900;n++){ g.fillStyle=n%2?'#000':'#fff'; g.fillRect(rnd(n)*w, rnd(n+7)*h, 18+rnd(n+3)*40, 1);} g.globalAlpha=1;
  });
}
function tiles(base, grout, size=128){
  return canvasTex(512,512,(g,w,h)=>{
    g.fillStyle=grout; g.fillRect(0,0,w,h);
    let i=0; for(let y=0;y<h;y+=size) for(let x=0;x<w;x+=size){ g.fillStyle=shade(base,0.97+rnd(i++)*0.06); g.fillRect(x+2,y+2,size-4,size-4); }
  });
}
function tvPicture(){
  return canvasTex(256,144,(g,w,h)=>{
    const gr=g.createLinearGradient(0,0,0,h); gr.addColorStop(0,'#f6b26b'); gr.addColorStop(.55,'#e46b5a'); gr.addColorStop(1,'#3b2e5a');
    g.fillStyle=gr; g.fillRect(0,0,w,h);
    g.fillStyle='rgba(255,236,200,.9)'; g.beginPath(); g.arc(170,78,22,0,7); g.fill();
    g.fillStyle='#2a2140'; g.beginPath(); g.moveTo(0,h); g.lineTo(0,100); g.lineTo(60,70); g.lineTo(120,104); g.lineTo(190,82); g.lineTo(256,110); g.lineTo(256,h); g.fill();
  });
}

  P.walls.forEach(([a,at,f,t,th])=>{ if(a==='h'){minx=Math.min(minx,f);maxx=Math.max(maxx,t);miny=Math.min(miny,at-th/2);maxy=Math.max(maxy,at+th/2);} else {miny=Math.min(miny,f);maxy=Math.max(maxy,t);minx=Math.min(minx,at-th/2);maxx=Math.max(maxx,at+th/2);} });
  const cx=(minx+maxx)/2, cy=(miny+maxy)/2;
  const X = px => (px-cx)*s, Z = py => (py-cy)*s;
  const spanW=(maxx-minx)*s, spanD=(maxy-miny)*s;

  // плита основания
  const slabM = mat('#d3d0ca');
  P.rooms.forEach(([,,,rects])=>rects.forEach(([x0,y0,x1,y1])=>{ const sl=new THREE.Mesh(new THREE.BoxGeometry((x1-x0)*s+0.3,0.12,(y1-y0)*s+0.3),slabM); sl.position.set(X((x0+x1)/2),-0.062,Z((y0+y1)/2)); sl.receiveShadow=true; root.add(sl); }));
  const ground = new THREE.Mesh(new THREE.CircleGeometry(30,64), new THREE.ShadowMaterial({opacity:.12}));
  ground.rotation.x=-Math.PI/2; ground.position.y=-0.121; ground.receiveShadow=true; root.add(ground);

  // полы
  const wood = herringbone(S.fl), tile = tiles(S.tile,S.grout,128), ltile = tiles(shade(S.tile,0.93),S.grout,170);
  P.rooms.forEach(([name,area,type,rects])=>{
    rects.forEach(([x0,y0,x1,y1])=>{
      const w=(x1-x0)*s, d=(y1-y0)*s;
      const base = type==='wet'?tile:type==='loggia'?ltile:wood;
      const t = base.clone(); t.needsUpdate=true;
      const tileM = type==='dry'?1.05:type==='wet'?1.2:1.4;
      t.repeat.set(w/tileM, d/tileM);
      const m = new THREE.MeshStandardMaterial({map:t, roughness:type==='dry'?.55:.35});
      const pl = new THREE.Mesh(new THREE.PlaneGeometry(w,d), m);
      pl.rotation.x=-Math.PI/2; pl.position.set(X((x0+x1)/2),0.004,Z((y0+y1)/2)); pl.receiveShadow=true; root.add(pl);
    });
    // подпись
    const big = rects.reduce((a,r)=> (r[2]-r[0])*(r[3]-r[1]) > (a[2]-a[0])*(a[3]-a[1]) ? r : a);
    const el=document.createElement('div'); el.className='label';
    el.innerHTML=`<b>${name}</b><span>${String(area).replace('.',',')} м²</span>`;
    const lo=new CSS2DObject(el); lo.position.set(X((big[0]+big[2])/2), 0.3, Z((big[1]+big[3])/2)); root.add(lo);
  });

  // стены
  const wallM = [mat(S.wall),mat(S.wall),mat('#f4f3f0',{roughness:.9}),mat(S.wall),mat(S.wall),mat(S.wall)];
  const frameM = mat(S.frame==='#ffffff'?'#f7f7f5':S.frame,{roughness:.5});
  const glassM = new THREE.MeshPhysicalMaterial({color:'#bcd7ea', roughness:.05, transmission:.6, transparent:true, opacity:.35});
  const doorM = mat(shade(S.wood,0.75),{roughness:.6});
  function wallBox(a,at,f,t,th,y0,y1){
    if(t-f<=0.01) return;
    const len=(t-f)*s, hh=y1-y0, thick=th*s;
    const me=new THREE.Mesh(new THREE.BoxGeometry(a==='h'?len:thick, hh, a==='h'?thick:len), wallM);
    if(a==='h') me.position.set(X((f+t)/2), y0+hh/2, Z(at)); else me.position.set(X(at), y0+hh/2, Z((f+t)/2));
    me.castShadow=true; me.receiveShadow=true; root.add(me); return me;
  }
  P.walls.forEach(([a,at,f,t,th])=>{
    const cuts = P.open.filter(o=>o[1]===a && Math.abs(o[2]-at)<=6 && o[3]<t && o[4]>f).sort((p,q)=>p[3]-q[3]);
    let pos=f;
    cuts.forEach(([type,,,o0,o1])=>{
      o0=Math.max(o0,f); o1=Math.min(o1,t);
      wallBox(a,at,pos,o0,th,0,H);
      if(type==='win'){
        wallBox(a,at,o0,o1,th,0,0.85);
        const len=(o1-o0)*s, cxp=(o0+o1)/2;
        const gw = a==='h'? [len,1.45,0.03] : [0.03,1.45,len];
        const gx = a==='h'? X(cxp):X(at), gz = a==='h'? Z(at):Z(cxp);
        const gl=new THREE.Mesh(new THREE.BoxGeometry(...gw),glassM); gl.position.set(gx,0.85+(H-0.85)/2,gz); gl.scale.y=(H-0.85)/1.45; root.add(gl);
        // рама
        const fr = (w,h,d,x,y,z)=>box(w,h,d,frameM,x,y,z);
        if(a==='h'){ fr(len,0.05,th*s*0.6,gx,0.875,gz); fr(0.05,H-0.85,0.06,gx,0.85+(H-0.85)/2,gz); }
        else { fr(th*s*0.6,0.05,len,gx,0.875,gz); fr(0.06,H-0.85,0.05,gx,0.85+(H-0.85)/2,gz); }

        if(type==='entry'){

        }

  // мебель
  const M = {

  const F = {
    bed(f){ const {g,len,dep}=frame(f.r,f.side); // len — ширина кровати, dep — длина
      box(len,0.32,dep,M.fabric,0,0.16,0,g); box(len-0.06,0.22,dep-0.08,M.white,0,0.43,0.02,g);
      box(len+0.02,1.05,0.08,M.fabric,0,0.52,-dep/2+0.04,g);
      box(len-0.04,0.06,dep*0.55,M.throw,0,0.56,dep*0.2,g);
      const pw=(len-0.3)/2; box(pw,0.14,0.36,M.pillow,-pw/2-0.05,0.6,-dep/2+0.3,g); box(pw,0.14,0.36,M.pillow,pw/2+0.05,0.6,-dep/2+0.3,g);
    },
    ns(f){ const q=R(f.r); box(q.w,0.5,q.d,M.wood,q.cx,0.25,q.cz); cyl(0.05,0.07,0.04,M.metal,q.cx,0.52,q.cz); cyl(0.012,0.012,0.25,M.metal,q.cx,0.66,q.cz,null,8); cyl(0.09,0.13,0.16,M.lamp,q.cx,0.82,q.cz); },
    wardrobe(f){ const {g,len,dep}=frame(f.r,f.side); box(len,2.1,dep,M.cab,0,1.05,0,g);
      const n=Math.max(2,Math.round(len/0.5)); for(let i=1;i<n;i++) box(0.012,2.0,0.01,M.dark,-len/2+i*len/n,1.05,dep/2+0.002,g);
      for(let i=0;i<n;i++) box(0.02,0.3,0.03,M.metal,-len/2+(i+0.5)*len/n+(i%2?-0.08:0.08),1.15,dep/2+0.02,g); },
    dresser(f){ const {g,len,dep}=frame(f.r,f.side); box(len,0.8,dep,M.wood,0,0.4,0,g);
      for(let i=1;i<3;i++) box(len-0.04,0.01,0.01,M.dark,0,i*0.26,dep/2+0.003,g);
      box(len*0.5,0.6,0.03,M.ceramic,0,1.4,-dep/2+0.02,g); },
    shelf(f){ const {g,len,dep}=frame(f.r,f.side);
      for(let y of [0.02,0.45,1.2,1.9,2.1]) box(len,0.025,dep,M.cab,0,y,0,g);
      box(len,0.02,0.02,M.metal,0,1.75,0,g);
      for(let i=0;i<Math.floor(len/0.12);i++) box(0.04,0.5+rnd(i)*0.3,dep*0.7,[M.throw,M.fabric,M.white,M.accent][i%4],-len/2+0.08+i*0.12,1.3-0.12,0,g); },
    sofa(f){ const {g,len,dep}=frame(f.r,f.side);
      box(len,0.42,dep,M.fabric,0,0.21,0,g); box(len,0.78,0.2,M.fabric,0,0.39,-dep/2+0.1,g);
      box(0.16,0.62,dep,M.fabric,-len/2+0.08,0.31,0,g); box(0.16,0.62,dep,M.fabric,len/2-0.08,0.31,0,g);
      const n=3, cw=(len-0.36)/n; for(let i=0;i<n;i++) box(cw-0.03,0.12,dep-0.28,M.pillow===M.accent?M.fabric:mat(shade(S.fabric,1.08),{roughness:.95}),-len/2+0.18+cw*(i+0.5),0.48,0.08,g);
      box(0.4,0.36,0.12,M.accent,-len/2+0.45,0.66,-dep/2+0.27,g).rotation.z=0.15; box(0.4,0.36,0.12,M.throw,len/2-0.45,0.66,-dep/2+0.27,g).rotation.z=-0.15; },
    lchair(f){ const q=R(f.r); const g=new THREE.Group(); g.position.set(q.cx,0,q.cz); root.add(g);
      box(q.w*0.9,0.38,q.d*0.9,M.fabric,0,0.24,0,g); box(q.w*0.9,0.4,0.1,M.fabric,0,0.55,-q.d*0.4,g);
      for(const [a,b] of [[-1,-1],[1,-1],[-1,1],[1,1]]) cyl(0.015,0.015,0.05,M.leg,a*q.w*0.38,0.025,b*q.d*0.38,g,8); },
    rug(f){ const q=R(f.r); const m=new THREE.Mesh(new THREE.BoxGeometry(q.w,0.012,q.d),M.rug); m.position.set(q.cx,0.006,q.cz); m.receiveShadow=true; root.add(m); },
    ctable(f){ const q=R(f.r); box(q.w,0.05,q.d,M.wood,q.cx,0.4,q.cz); box(q.w*0.9,0.03,q.d*0.9,M.leg,q.cx,0.08,q.cz);
      for(const [a,b] of [[-1,-1],[1,-1],[-1,1],[1,1]]) box(0.03,0.36,0.03,M.leg,q.cx+a*(q.w/2-0.05),0.2,q.cz+b*(q.d/2-0.05));
      cyl(0.1,0.08,0.06,M.ceramic,q.cx+q.w*0.2,0.455,q.cz); },
    tv(f){ const {g,len,dep}=frame(f.r,f.side);
      box(len,0.45,dep,M.wood,0,0.225,0,g); box(len*0.98,0.01,0.01,M.dark,0,0.3,dep/2+0.003,g);
      const tw=Math.min(1.6,len*0.7); box(tw,0.9,0.04,M.dark,0,1.35,-dep/2+0.03,g);
      const scr=new THREE.Mesh(new THREE.PlaneGeometry(tw-0.04,0.86),new THREE.MeshBasicMaterial({map:tvPicture()}));
      scr.position.set(0,1.35,-dep/2+0.052); g.add(scr);
      cyl(0.06,0.05,0.14,M.ceramic,len/2-0.25,0.52,0,g); },
    dining(f){ const g=new THREE.Group(); g.position.set(X(f.c[0]),0,Z(f.c[1])); g.rotation.y=(f.rot||0)*Math.PI/180; root.add(g);
      box(1.2,0.04,0.8,M.wood,0,0.75,0,g); for(const [a,b] of [[-1,-1],[1,-1],[-1,1],[1,1]]) box(0.04,0.73,0.04,M.leg,a*0.54,0.365,b*0.34,g);
      for(const [cx,cz,ry] of [[-0.3,-0.62,0],[0.3,-0.62,0],[-0.3,0.62,Math.PI],[0.3,0.62,Math.PI]]){
        const c=new THREE.Group(); c.position.set(cx,0,cz); c.rotation.y=ry; g.add(c);
        box(0.42,0.05,0.42,M.fabric,0,0.46,0,c); box(0.42,0.42,0.04,M.fabric,0,0.7,-0.19,c);
        for(const [a,b] of [[-1,-1],[1,-1],[-1,1],[1,1]]) box(0.025,0.44,0.025,M.leg,a*0.18,0.22,b*0.18,c); }
      cyl(0.11,0.09,0.12,M.ceramic,0,0.83,0,g); leafy(g,0,0.95,0,0.12); },
    kitchen(f){
      f.runs.forEach(([x0,y0,x1,y1,side],ri)=>{ const {g,len,dep}=frame([x0,y0,x1,y1],side);
        box(len,0.8,dep-0.02,M.cab,0,0.45,0.01,g); box(len,0.1,dep-0.06,M.dark,0,0.05,-0.01,g);
        box(len,0.04,dep,M.counter,0,0.87,0,g);
        const n=Math.max(1,Math.round(len/0.6)); for(let i=1;i<n;i++) box(0.006,0.76,0.005,M.dark,-len/2+i*len/n,0.45,dep/2,g);
        box(len,0.6,0.34,M.cab,0,1.75,-dep/2+0.17,g); for(let i=1;i<n;i++) box(0.006,0.58,0.005,M.dark,-len/2+i*len/n,1.75,-dep/2+0.345,g);
        box(len,0.55,0.01,mat(shade(S.counter,0.92),{roughness:.3}),0,1.17,-dep/2+0.006,g);
        if(f.sink && f.sink[0]===ri){ const u=-len/2+len*f.sink[1]; box(0.5,0.02,0.4,M.steel,u,0.885,0,g); cyl(0.015,0.015,0.3,M.steel,u,1.03,-dep/2+0.08,g,8); }
        if(f.hob && f.hob[0]===ri){ const u=-len/2+len*f.hob[1]; box(0.58,0.01,0.5,M.dark,u,0.895,0,g);
          for(const [a,b] of [[-1,-1],[1,-1],[-1,1],[1,1]]) cyl(0.08,0.08,0.004,mat('#3a3c40'),u+a*0.13,0.902,b*0.12,g); box(0.6,0.25,0.34,M.metal,u,1.5,-dep/2+0.17,g); }
      });
      if(f.fridge){ const [x0,y0,x1,y1,side]=f.fridge; const {g,len,dep}=frame([x0,y0,x1,y1],side);
        box(len-0.02,2.0,dep,S.id==='loft'||S.id==='modern'?M.steel:M.white,0,1.0,0,g); box(len-0.04,0.008,0.005,M.dark,0,1.25,dep/2+0.002,g); box(0.025,0.5,0.03,M.metal,len/2-0.1,1.45,dep/2+0.02,g); }
    },
    tub(f){ const {g,len,dep}=frame(f.r,f.side); box(len,0.55,dep,M.ceramic,0,0.275,0,g);
      const inner=new THREE.Mesh(new THREE.BoxGeometry(len-0.12,0.02,dep-0.12),mat('#dfe9ee',{roughness:.1})); inner.position.set(0,0.56,0); g.add(inner);
      cyl(0.02,0.02,0.2,M.steel,len/2-0.25,0.7,-dep/2+0.05,g,8); },
    wc(f){ const {g,len,dep}=frame(f.r,f.side); box(Math.min(len,0.4),0.38,0.18,M.ceramic,0,0.6,-dep/2+0.09,g);
      const b=cyl(0.19,0.16,0.4,M.ceramic,0,0.2,0.05,g); b.scale.set(1,1,1.3); box(0.38,0.03,0.46,M.ceramic,0,0.41,0.03,g); },
    basin(f){ const {g,len,dep}=frame(f.r,f.side); box(len,0.5,dep,M.wood,0,0.55,0,g); box(len*0.8,0.08,dep*0.8,M.ceramic,0,0.84,0.02,g);
      cyl(0.015,0.015,0.18,M.steel,0,0.95,-dep/2+0.06,g,8); box(len*0.85,0.75,0.02,mat('#cfdde6',{roughness:.05,metalness:.9}),0,1.55,-dep/2+0.01,g); },
    shower(f){ const q=R(f.r); box(q.w,0.06,q.d,M.ceramic,q.cx,0.03,q.cz);
      const gl=new THREE.Mesh(new THREE.BoxGeometry(0.01,1.95,q.d),glassM); gl.position.set(q.x1-0.01,1.04,q.cz); root.add(gl);
      cyl(0.08,0.08,0.01,M.steel,q.cx,2.05,q.cz,null,16); },
    washer(f){ const {g,len,dep}=frame(f.r,f.side); box(len,0.85,dep,M.white,0,0.425,0,g);
      const d=cyl(0.17,0.17,0.02,mat('#9fb0bd',{roughness:.1}),0,0.45,dep/2,g); d.rotation.x=Math.PI/2; },
    console(f){ const {g,len,dep}=frame(f.r,f.side); box(len,0.08,dep,M.wood,0,0.8,0,g); box(len,0.3,dep,M.wood,0,0.15,0,g);
      box(0.02,0.65,dep-0.02,M.leg,-len/2+0.02,0.47,0,g); box(0.02,0.65,dep-0.02,M.leg,len/2-0.02,0.47,0,g);
      const mr=cyl(0.35,0.35,0.02,mat('#cfdde6',{roughness:.05,metalness:.9}),0,1.5,-dep/2+0.02,g,32); mr.rotation.x=Math.PI/2; },
    plant(f){ const x=X(f.c[0]), z=Z(f.c[1]), r=f.z*s*0.5; cyl(r*0.75,r*0.6,r*1.4,M.pot,x,r*0.7,z); leafy(root,x,r*1.4,z,r*1.5); }
  };
  function leafy(parent,x,y,z,r){ for(let i=0;i<9;i++){ const a=i*2.4, rr=r*(0.25+rnd(i)*0.35);
      const sp=new THREE.Mesh(new THREE.SphereGeometry(r*0.42,10,8),i%2?M.green:M.green2);
      sp.position.set(x+Math.cos(a)*rr, y+r*0.5+rnd(i+2)*r*0.9, z+Math.sin(a)*rr); sp.scale.y=1.3; sp.castShadow=true; parent.add(sp);} }
  P.furn.forEach(f=>{ if(F[f.k]) F[f.k](f); });

  // камера
  root.userData.span = Math.max(spanW, spanD); root.userData.w=spanW; root.userData.d=spanD; root.userData.w=spanW; root.userData.d=spanD;
}

/* ================= КАМЕРА / UI ================= */
function setView(v, instant){
  cur.view=v; const w=root.userData.w, d=root.userData.d;
  const narrow = innerWidth<=760, asp = narrow ? innerWidth/(innerHeight*0.55) : (innerWidth-370)/innerHeight;
  const t = Math.tan(THREE.MathUtils.degToRad(camera.fov/2));
  const dist = Math.max(d/2/t, w/2/t/asp)*(v==='top'?1.12:1.3);
  const target = new THREE.Vector3(0,0,0);
  const dir = v==='top' ? new THREE.Vector3(0,1,0.0005) : new THREE.Vector3(-0.3,1.0,0.62).normalize();
  const pos = dir.multiplyScalar(dist);
  controls.target.copy(target); camera.position.copy(pos); camera.lookAt(target); controls.update();
  document.getElementById('v3d').classList.toggle('on', v==='3d'); document.getElementById('vtop').classList.toggle('on', v==='top');
}
function fmt(n){ return (n/1e6).toFixed(1).replace('.',','); }
function updatePrice(){
  const P=PLANS[cur.plan], S=STYLES[cur.style];
  const a = P.area - P.loggiaCounted;
  document.getElementById('pv').textContent = `${fmt(a*S.rate[0])} – ${fmt(a*S.rate[1])} млн ₸`;
  document.getElementById('pn').textContent = `≈ ${(S.rate[0]/1000)}–${(S.rate[1]/1000)} тыс. ₸ за м² · ${a.toFixed(1).replace('.',',')} м² без лоджии · работы и материалы, без мебели и техники. Ориентировочная оценка по рынку Астаны.`;
  document.getElementById('desc').textContent = S.desc;
}
function renderUI(){
  const apts=document.getElementById('apts'); apts.innerHTML='';
  Object.entries(PLANS).forEach(([k,P])=>{ const b=document.createElement('button'); b.className='apt'+(k===cur.plan?' on':'');
    b.innerHTML=`<b>${String(P.area.toFixed(2)).replace('.',',')} м²</b><span>${P.title} квартира</span>`;
    b.onclick=()=>{ cur.plan=k; build(); setView(cur.view); renderUI(); }; apts.appendChild(b); });
  const st=document.getElementById('styles'); st.innerHTML='';
  STYLES.forEach((S,i)=>{ const b=document.createElement('button'); b.className='st'+(i===cur.style?' on':'');
    b.innerHTML=`<i style="background:${S.dot}"></i>${S.name}`;
    b.onclick=()=>{ cur.style=i; const p=camera.position.clone(), t=controls.target.clone(); build(); camera.position.copy(p); controls.target.copy(t); controls.update(); renderUI(); }; st.appendChild(b); });
  updatePrice();
}
document.getElementById('v3d').onclick=()=>setView('3d');
document.getElementById('vtop').onclick=()=>setView('top');
document.getElementById('vlbl').onclick=e=>{ document.body.classList.toggle('nolabels'); e.currentTarget.classList.toggle('on'); };
document.getElementById('tg').onclick=e=>{ const p=document.getElementById('panel'); p.classList.toggle('collapsed'); e.currentTarget.textContent=p.classList.contains('collapsed')?'Развернуть':'Свернуть'; };

function fitOffset(){ const off = innerWidth>760 ? 185 : 0; const off2 = innerWidth>760 ? 0 : -innerHeight*0.18; camera.setViewOffset(innerWidth, innerHeight, -off, -off2, innerWidth, innerHeight); camera.updateProjectionMatrix(); }
addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; fitOffset(); renderer.setSize(innerWidth,innerHeight); lr.setSize(innerWidth,innerHeight); });
const qs=new URLSearchParams(location.search); if(qs.get('plan')) cur.plan=qs.get('plan'); if(qs.get('style')) cur.style=+qs.get('style');
fitOffset(); build(); renderUI(); setView(qs.get('view')||'3d');
(function loop(){ requestAnimationFrame(loop); controls.update(); renderer.render(scene,camera); lr.render(scene,camera); })();
</script>
</body>
</html>
